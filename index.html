<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Marketplace académico para la comunidad UTP">
  <title>UTP Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
</head>
<body data-page="home" class="page-home d-flex flex-column min-vh-100">
  <header id="site-header"></header>
  <main>
    <section class="hero">
      <div class="container">
        <div class="hero__content text-center">
          <span class="section-label">Hecho para estudiantes</span>
          <h1 class="page-title hero__title">
            Compra, presta e intercambia dentro de la <span>UTP</span>
          </h1>
          <p class="hero__description">Una forma sencilla de encontrar materiales y publicar lo que ya no usas.</p>
          <a class="btn btn-primary btn-lg" href="pages/catalogo.html">Explorar catálogo</a>
        </div>
      </div>
    </section>
    <section class="container py-5">
      <h2 class="h3 mb-4">Explora por categoría</h2>
      <div class="row g-3 categories">
        <div class="col-6 col-md-3"><a href="pages/catalogo.html" class="category-card">Libros</a></div>
        <div class="col-6 col-md-3"><a href="pages/catalogo.html" class="category-card">Tecnología</a></div>
        <div class="col-6 col-md-3"><a href="pages/catalogo.html" class="category-card">Materiales</a></div>
        <div class="col-6 col-md-3"><a href="pages/catalogo.html" class="category-card">Otros</a></div>
      </div>
    </section>
    <section class="container pb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0">Últimos productos</h2>
        <a href="pages/catalogo.html">Ver todos</a>
      </div>
      <div id="alert-container"></div>
      <div id="latest-products" class="row g-4"><p>Cargando productos…</p></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
