<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacto | UTP Marketplace</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link href="../assets/css/style.css" rel="stylesheet"></head><body data-page="contact"><div id="app-header"></div><div id="app-alerts" class="alert-zone container" aria-live="polite"></div><main class="section"><div class="container narrow"><div class="page-heading"><div><span class="eyebrow">Estamos para orientarte</span><h1>Contacto y seguridad</h1><p>Este canal simula la atención del marketplace académico.</p></div></div><div class="surface p-4 p-md-5"><form class="row g-3" onsubmit="event.preventDefault();document.querySelector('#contactSuccess').hidden=false;this.reset()"><div class="col-md-6"><label class="form-label" for="contactName">Nombre</label><input class="form-control" id="contactName" required></div><div class="col-md-6"><label class="form-label" for="contactEmail">Correo</label><input class="form-control" id="contactEmail" type="email" required></div><div class="col-12"><label class="form-label" for="contactReason">Motivo</label><select class="form-select" id="contactReason"><option>Consulta general</option><option>Reportar publicación</option><option>Problema de seguridad</option></select></div><div class="col-12"><label class="form-label" for="contactMessage">Mensaje</label><textarea class="form-control" id="contactMessage" rows="5" required></textarea></div><div class="col-12"><button class="btn btn-primary" type="submit">Enviar mensaje</button></div><p id="contactSuccess" class="alert alert-success" hidden>Mensaje recibido en la demostración.</p></form></div></div></main><div id="app-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../js/main.js"></script></body></html>
