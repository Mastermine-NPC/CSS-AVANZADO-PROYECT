<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | UTP Marketplace</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">UTP Marketplace</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="carrito.html">Carrito</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row">
            
            <aside class="col-lg-3 mb-4">
                <div class="card shadow-sm border-0 filter-sidebar">
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-4">Filtros</h5>
                        <div class="mb-4">
                            <label for="searchInput" class="form-label fw-semibold">Buscar</label>
                            <input type="text" class="form-control" id="searchInput" placeholder="Ej: Libro Cálculo...">
                        </div>
                        <button class="btn btn-primary w-100">Aplicar Filtros</button>
                    </div>
                </div>
            </aside>

            <section class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="h4 mb-0">Mostrando Productos</h2>
                    <select class="form-select w-auto">
                        <option selected>Más recientes</option>
                        <option value="1">Menor precio</option>
                        <option value="2">Mayor precio</option>
                    </select>
                </div>

                <div class="row g-4" id="productList">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-2 text-muted">Cargando catálogo...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="../js/products.js"></script>
</body>
</html>
