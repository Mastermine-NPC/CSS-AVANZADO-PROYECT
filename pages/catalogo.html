<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | UTP Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="catalog" class="page-catalog d-flex flex-column min-vh-100">
  <header id="site-header"></header>
  <main class="container py-5">
    <h1 class="page-title">Catálogo</h1>
    <div id="alert-container"></div>
    <section class="filter-panel mb-4" aria-label="Filtros del catálogo">
      <div class="row g-3">
        <div class="col-md-6"><label for="search" class="form-label">Buscar</label><input id="search" class="form-control" type="search" placeholder="Nombre o descripción"></div>
        <div class="col-md-3"><label for="category-filter" class="form-label">Categoría</label><select id="category-filter" class="form-select"><option value="">Todas</option><option>Libros</option><option>Tecnología</option><option>Materiales</option><option>Otros</option></select></div>
        <div class="col-md-3"><label for="type-filter" class="form-label">Modalidad</label><select id="type-filter" class="form-select"><option value="">Todas</option><option value="sale">Venta</option><option value="loan">Préstamo</option><option value="exchange">Intercambio</option></select></div>
      </div>
    </section>
    <div id="catalog-products" class="row g-4"><p>Cargando productos…</p></div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
