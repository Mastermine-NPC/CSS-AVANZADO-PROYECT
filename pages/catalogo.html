<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo | UTP Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">
    <header class="market-header">
        <div class="container">
            <div class="market-header__top">
                <a class="market-brand" href="../index.html">
                    <strong>UTP Marketplace</strong>
                    <span>Compra, vende e intercambia entre estudiantes</span>
                </a>
                <form class="market-search" action="catalogo.html">
                    <label class="visually-hidden" for="mainSearch">Buscar productos</label>
                    <input id="mainSearch" name="q" type="search" placeholder="Buscar libros, calculadoras, componentes o servicios">
                    <button type="submit">Buscar</button>
                </form>
                <nav class="market-nav" aria-label="Navegacion principal">
                    <a href="../index.html">Inicio</a>
                    <a class="active" href="catalogo.html">Catalogo</a>
                    <a href="carrito.html">Carrito</a>
                    <a href="../index.html#contacto">Contacto</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container py-5">
        <div class="catalog-header">
            <div>
                <span class="section-kicker">Catalogo universitario</span>
                <h1>Catalogo universitario</h1>
                <p>Filtra productos por categoria, precio o estado.</p>
            </div>
            <a href="carrito.html" class="btn btn-outline-market">Ver carrito</a>
        </div>

        <div class="row g-4">
            <aside class="col-lg-3">
                <div class="filter-sidebar">
                    <h2>Filtros</h2>
                    <div class="mb-3">
                        <label for="searchInput" class="form-label">Buscar producto</label>
                        <input type="text" class="form-control" id="searchInput" placeholder="Ej: Arduino, libro, kit">
                    </div>
                    <div class="mb-3">
                        <label for="categoryFilter" class="form-label">Categoria</label>
                        <select class="form-select" id="categoryFilter">
                            <option value="">Todas las categorias</option>
                            <option value="Libros">Libros y apuntes</option>
                            <option value="Electronica">Electronica</option>
                            <option value="Proyectos">Proyectos y maquetas</option>
                            <option value="Accesorios">Accesorios universitarios</option>
                            <option value="Servicios">Servicios academicos</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="priceFilter" class="form-label">Rango de precio</label>
                        <select class="form-select" id="priceFilter">
                            <option value="">Todos los precios</option>
                            <option value="50">Hasta S/50</option>
                            <option value="100">Hasta S/100</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label for="conditionFilter" class="form-label">Estado</label>
                        <select class="form-select" id="conditionFilter">
                            <option value="">Todos los estados</option>
                            <option value="Nuevo">Nuevo</option>
                            <option value="Usado">Usado</option>
                            <option value="Intercambio">Intercambio</option>
                        </select>
                    </div>
                    <button class="btn btn-market w-100 mb-2" id="btnFilter" type="button">Filtrar catalogo</button>
                    <button class="btn btn-outline-secondary w-100" id="btnClearFilters" type="button">Limpiar filtros</button>
                </div>
            </aside>

            <section class="col-lg-9">
                <div class="catalog-toolbar">
                    <h2 class="h4 mb-0">Productos encontrados</h2>
                    <span class="result-pill" id="resultCount">Cargando productos</span>
                </div>
                <div class="product-grid" id="productList">
                    <div class="catalog-state">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p>Cargando catalogo...</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/products.js"></script>
</body>
</html>
