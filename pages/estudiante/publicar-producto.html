<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Publicar producto | UTP Marketplace</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link href="../../assets/css/style.css" rel="stylesheet"></head><body data-page="product-form"><div id="app-header"></div><div id="app-alerts" class="alert-zone container" aria-live="polite"></div><main class="section"><div class="container narrow"><div class="page-heading"><div><span class="eyebrow">Nueva publicación</span><h1>Publicar producto</h1><p>Describe claramente el artículo y la modalidad.</p></div><a href="mis-productos.html">Cancelar</a></div><form id="productForm" class="surface p-4 p-md-5 row g-3" novalidate><div class="col-12"><label class="form-label" for="title">Título</label><input class="form-control" id="title" name="title" required maxlength="90"><div class="invalid-feedback">Ingresa un título.</div></div><div class="col-12"><label class="form-label" for="description">Descripción</label><textarea class="form-control" id="description" name="description" rows="5" required></textarea></div><div class="col-md-6"><label class="form-label" for="category">Categoría</label><select class="form-select" id="category" name="category" required><option value="">Selecciona</option><option>Libros</option><option>Electrónica</option><option>Arquitectura</option><option>Accesorios</option><option>Instrumentos</option><option>Servicios</option></select></div><div class="col-md-6"><label class="form-label" for="transactionType">Modalidad</label><select class="form-select" id="transactionType" name="transactionType" required><option value="sale">Venta</option><option value="loan">Préstamo</option><option value="exchange">Intercambio</option><option value="donation">Donación</option></select></div><div class="col-md-6" id="priceGroup"><label class="form-label" for="price">Precio en soles</label><input class="form-control" id="price" name="price" type="number" min="0" step="0.10"></div><div class="col-md-6"><label class="form-label" for="condition">Condición</label><select class="form-select" id="condition" name="condition" required><option>Nuevo</option><option>Como nuevo</option><option>Buen estado</option><option>Usado</option></select></div><div class="col-md-6"><label class="form-label" for="campus">Campus</label><select class="form-select" id="campus" name="campus" required><option>Lima Centro</option><option>Lima Norte</option><option>Arequipa</option><option>Chiclayo</option></select></div><div class="col-md-6"><label class="form-label" for="quantity">Cantidad</label><input class="form-control" id="quantity" name="quantity" type="number" min="1" value="1" required></div><div class="col-12" id="loanGroup" hidden><label class="form-label" for="loanConditions">Duración y condiciones del préstamo</label><textarea class="form-control" id="loanConditions" name="loanConditions" rows="3"></textarea></div><div class="col-12" id="exchangeGroup" hidden><label class="form-label" for="exchangePreferences">Preferencias de intercambio</label><textarea class="form-control" id="exchangePreferences" name="exchangePreferences" rows="3"></textarea></div><div class="col-12"><label class="form-label" for="images">Imágenes</label><input class="form-control" id="images" name="images" type="file" accept="image/*" multiple required><div class="form-text">Hasta 5 imágenes JPG/PNG de 5 MB cada una.</div><div id="imagePreview" class="image-preview"></div></div><div class="col-12"><button class="btn btn-primary" type="submit">Publicar y enviar a revisión</button></div></form></div></main><div id="app-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../../js/main.js"></script><script type="module">import{requireStudent}from'../../js/utils/guards.js';await requireStudent();</script><script type="module" src="../../js/pages/product-form.js"></script></body></html>
