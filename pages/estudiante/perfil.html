<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi perfil | UTP Marketplace</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link href="../../assets/css/style.css" rel="stylesheet"></head><body data-page="profile"><div id="app-header"></div><div id="app-alerts" class="alert-zone container" aria-live="polite"></div><main class="section"><div class="container narrow"><div class="page-heading"><div><span class="eyebrow">Cuenta de estudiante</span><h1>Mi perfil</h1><p>Actualiza la información visible para la comunidad.</p></div><a href="dashboard.html">Volver al panel</a></div><form id="profileForm" class="surface p-4 p-md-5 row g-3" novalidate><div class="col-12 profile-photo"><img id="avatarPreview" src="https://picsum.photos/seed/avatar/160" alt="Foto de perfil"><div><label class="form-label" for="photo">Cambiar fotografía</label><input class="form-control" id="photo" name="photo" type="file" accept="image/*"><small>JPG o PNG, máximo 5 MB.</small></div></div><div class="col-md-6"><label class="form-label" for="firstName">Nombres</label><input class="form-control" id="firstName" name="firstName" required></div><div class="col-md-6"><label class="form-label" for="lastName">Apellidos</label><input class="form-control" id="lastName" name="lastName" required></div><div class="col-md-6"><label class="form-label" for="email">Correo (no editable)</label><input class="form-control" id="email" name="email" disabled></div><div class="col-md-6"><label class="form-label" for="role">Rol (no editable)</label><input class="form-control" id="role" name="role" disabled></div><div class="col-md-6"><label class="form-label" for="career">Carrera</label><input class="form-control" id="career" name="career" required></div><div class="col-md-6"><label class="form-label" for="campus">Campus</label><input class="form-control" id="campus" name="campus" required></div><div class="col-md-6"><label class="form-label" for="phone">Teléfono opcional</label><input class="form-control" id="phone" name="phone"></div><div class="col-12"><label class="form-label" for="bio">Descripción</label><textarea class="form-control" id="bio" name="bio" rows="4"></textarea></div><div class="col-12"><button class="btn btn-primary" type="submit">Guardar cambios</button></div></form></div></main><div id="app-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../../js/main.js"></script><script type="module">import{requireStudent}from'../../js/utils/guards.js';await requireStudent();</script><script type="module" src="../../js/pages/profile.js"></script></body></html>
