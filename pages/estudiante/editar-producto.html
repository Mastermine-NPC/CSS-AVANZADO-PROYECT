<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar producto | UTP Marketplace</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link href="../../assets/css/style.css" rel="stylesheet"></head><body data-page="product-form"><div id="app-header"></div><div id="app-alerts" class="alert-zone container" aria-live="polite"></div><main class="section"><div class="container narrow"><div class="page-heading"><div><span class="eyebrow">Gestiona tu publicación</span><h1>Editar producto</h1><p>Los cambios importantes pueden volver a moderación.</p></div><a href="mis-productos.html">Cancelar</a></div><form id="productForm" class="surface p-4 p-md-5 row g-3" novalidate><div class="col-12"><label class="form-label" for="title">Título</label><input class="form-control" id="title" name="title" required></div><div class="col-12"><label class="form-label" for="description">Descripción</label><textarea class="form-control" id="description" name="description" rows="5" required></textarea></div><div class="col-md-6"><label class="form-label" for="category">Categoría</label><select class="form-select" id="category" name="category"><option>Libros</option><option>Electrónica</option><option>Arquitectura</option><option>Accesorios</option><option>Instrumentos</option><option>Servicios</option></select></div><div class="col-md-6"><label class="form-label" for="transactionType">Modalidad</label><select class="form-select" id="transactionType" name="transactionType"><option value="sale">Venta</option><option value="loan">Préstamo</option><option value="exchange">Intercambio</option><option value="donation">Donación</option></select></div><div class="col-md-6" id="priceGroup"><label class="form-label" for="price">Precio</label><input class="form-control" id="price" name="price" type="number" min="0"></div><div class="col-md-6"><label class="form-label" for="condition">Condición</label><select class="form-select" id="condition" name="condition"><option>Nuevo</option><option>Como nuevo</option><option>Buen estado</option><option>Usado</option></select></div><div class="col-md-6"><label class="form-label" for="campus">Campus</label><input class="form-control" id="campus" name="campus" required></div><div class="col-md-6"><label class="form-label" for="quantity">Cantidad</label><input class="form-control" id="quantity" name="quantity" type="number" min="1" required></div><div class="col-12" id="loanGroup" hidden><label class="form-label" for="loanConditions">Condiciones del préstamo</label><textarea class="form-control" id="loanConditions" name="loanConditions"></textarea></div><div class="col-12" id="exchangeGroup" hidden><label class="form-label" for="exchangePreferences">Preferencias de intercambio</label><textarea class="form-control" id="exchangePreferences" name="exchangePreferences"></textarea></div><div class="col-12"><label class="form-label" for="images">Agregar imágenes</label><input class="form-control" id="images" name="images" type="file" accept="image/*" multiple><div id="imagePreview" class="image-preview"></div></div><div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Guardar cambios</button><button class="btn btn-outline-danger" type="button">Desactivar publicación</button></div></form></div></main><div id="app-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../../js/main.js"></script><script type="module">import{requireStudent}from'../../js/utils/guards.js';await requireStudent();</script><script type="module" src="../../js/pages/product-form.js"></script></body></html>
