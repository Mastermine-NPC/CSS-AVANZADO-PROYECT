<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producto | UTP Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="product" class="page-product d-flex flex-column min-vh-100">
  <header id="site-header"></header>
  <main class="container py-5">
    <div id="alert-container"></div>
    <article id="product-detail" class="product-detail row g-5">
      <div class="col-lg-6"><img data-product-image class="product-detail__image" src="../assets/img/product-placeholder.svg" alt=""></div>
      <div class="col-lg-6">
        <span data-product-type class="badge text-bg-primary mb-3"></span>
        <h1 data-product-name class="page-title"></h1>
        <p data-product-description class="product-detail__description"></p>
        <dl class="row product-data">
          <dt class="col-5">Categoría</dt><dd data-product-category class="col-7"></dd>
          <dt class="col-5">Estado</dt><dd data-product-status class="col-7"></dd>
          <dt class="col-5">Condición</dt><dd data-product-condition class="col-7"></dd>
          <dt class="col-5">Precio</dt><dd data-product-price class="col-7"></dd>
          <dt class="col-5 product-owner-label">Publicado por</dt><dd data-product-owner class="col-7 product-owner-value"></dd>
        </dl>
        <button id="add-to-cart" class="btn btn-primary" type="button">Agregar al carrito</button>
      </div>
    </article>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
