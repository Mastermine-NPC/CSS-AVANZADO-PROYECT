<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publicar producto | UTP Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="publish" class="page-publish-product d-flex flex-column min-vh-100">
  <header id="site-header"></header>
  <main class="container py-5 panel-page">
    <h1 class="page-title">Publicar producto</h1>
    <p class="text-secondary">La imagen se agrega mediante URL; no se suben archivos.</p>
    <div id="alert-container"></div>
    <form id="publish-form" class="content-card row g-3">
      <div class="col-12"><label for="name" class="form-label">Nombre</label><input id="name" name="name" class="form-control" required maxlength="100"></div>
      <div class="col-12">
        <label for="description" class="form-label">Descripción</label>
        <textarea id="description" name="description" class="form-control" rows="5" minlength="20" maxlength="500" required aria-describedby="description-help description-count"></textarea>
        <div class="d-flex justify-content-between gap-3 form-text"><span id="description-help">Describe el estado, uso y detalles importantes del producto.</span><span id="description-count" class="text-nowrap">0 / 500 caracteres</span></div>
      </div>
      <div class="col-md-6"><label for="category" class="form-label">Categoría</label><select id="category" name="category" class="form-select" required><option>Libros</option><option>Tecnología</option><option>Materiales</option><option>Otros</option></select></div>
      <div class="col-md-6"><label for="transactionType" class="form-label">Modalidad</label><select id="transactionType" name="transactionType" class="form-select" required><option value="sale">Venta</option><option value="loan">Préstamo</option><option value="exchange">Intercambio</option></select></div>
      <div class="col-md-6"><label for="price" class="form-label">Precio (COP)</label><input id="price" name="price" class="form-control" type="number" min="0" step="100"></div>
      <div class="col-md-6"><label for="condition" class="form-label">Condición</label><select id="condition" name="condition" class="form-select" required><option>Nuevo</option><option>Como nuevo</option><option>Usado</option></select></div>
      <div class="col-12"><label for="imageUrl" class="form-label">URL de imagen (opcional)</label><input id="imageUrl" name="imageUrl" class="form-control" type="url" placeholder="https://ejemplo.com/imagen.jpg"></div>
      <div class="col-12"><button class="btn btn-primary" type="submit">Publicar</button></div>
    </form>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
