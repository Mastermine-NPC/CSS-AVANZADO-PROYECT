<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | UTP Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">UTP Marketplace</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="../index.html">Inicio</a>
                <a class="nav-link" href="catalogo.html">Catálogo</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <h2 class="mb-4">Tu Carrito de Compras</h2>
        <div class="row">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th>Acción</th>
                                </tr>
                            </thead>
                            <tbody id="cart-items">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 p-3">
                    <h4>Resumen</h4>
                    <p>Total: <strong id="cart-total">S/ 0.00</strong></p>
                    <button class="btn btn-success w-100">Finalizar Compra</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/cart.js"></script>
</body>
</html>
