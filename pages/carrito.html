<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrito | UTP Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="cart" class="page-cart d-flex flex-column min-vh-100">
  <header id="site-header"></header>
  <main class="container py-5">
    <h1 class="page-title">Carrito</h1>
    <p class="text-secondary">Los productos se guardan únicamente en este navegador.</p>
    <div id="alert-container"></div>
    <div class="row g-4">
      <section class="col-lg-8"><div id="cart-items" class="content-card"></div></section>
      <aside class="col-lg-4"><div class="content-card"><h2 class="h4">Resumen</h2><p class="d-flex justify-content-between"><span>Total</span><strong id="cart-total">$0</strong></p><button id="clear-cart" class="btn btn-outline-danger w-100" type="button">Vaciar carrito</button></div></aside>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
