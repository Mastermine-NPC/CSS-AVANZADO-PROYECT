<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro | UTP Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="register" class="page-auth d-flex flex-column min-vh-100">
  <header id="site-header"></header>
  <main class="container auth-page py-5">
    <section class="auth-card">
      <h1 class="page-title">Crear cuenta</h1>
      <div id="alert-container"></div>
      <form id="register-form">
        <div class="mb-3"><label for="name" class="form-label">Nombre</label><input id="name" name="name" class="form-control" required maxlength="80" autocomplete="name"></div>
        <div class="mb-3"><label for="email" class="form-label">Correo</label><input id="email" name="email" class="form-control" type="email" required autocomplete="email"></div>
        <div class="mb-3"><label for="password" class="form-label">Contraseña</label><input id="password" name="password" class="form-control" type="password" required minlength="6" autocomplete="new-password"></div>
        <div class="mb-3"><label for="career" class="form-label">Carrera</label><input id="career" name="career" class="form-control" required maxlength="100"></div>
        <div class="mb-3"><label for="campus" class="form-label">Campus</label><select id="campus" name="campus" class="form-select" required><option value="">Selecciona</option><option>Campus Central</option><option>Campus Sur</option><option>Otro</option></select></div>
        <button class="btn btn-primary w-100" type="submit">Registrarme</button>
      </form>
      <p class="text-center mt-4 mb-0">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
