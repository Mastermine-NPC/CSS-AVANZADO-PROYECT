<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | UTP Marketplace</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet"><link href="../assets/css/style.css" rel="stylesheet"></head><body data-page="login" class="auth-page"><div id="app-header"></div><div id="app-alerts" class="alert-zone container" aria-live="polite"></div><main class="auth-layout"><section class="auth-card"><span class="eyebrow">Qué bueno verte</span><h1>Inicia sesión</h1><p>Administra publicaciones y solicitudes.</p><form data-auth-form="login" novalidate><label class="form-label" for="email">Correo</label><input class="form-control mb-3" id="email" name="email" type="email" required autocomplete="email"><div class="invalid-feedback">Ingresa un correo válido.</div><label class="form-label" for="password">Contraseña</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"><div class="invalid-feedback">Ingresa tu contraseña.</div><div class="d-flex justify-content-between my-3"><label><input class="form-check-input" name="remember" type="checkbox"> Recordarme</label><a href="recuperar-password.html">¿Olvidaste tu contraseña?</a></div><button class="btn btn-primary w-100" type="submit">Ingresar</button></form><p class="text-center mt-4">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p></section></main><div id="app-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script type="module" src="../js/main.js"></script><script type="module" src="../js/pages/auth.js"></script></body></html>
