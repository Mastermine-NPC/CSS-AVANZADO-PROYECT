<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | UTP Marketplace</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="login" class="page-auth d-flex flex-column min-vh-100">
  <header id="site-header"></header>
  <main class="container auth-page py-5">
    <section class="auth-card">
      <h1 class="page-title">Iniciar sesión</h1>
      <p class="text-secondary">Ingresa con tu correo y contraseña.</p>
      <div id="alert-container"></div>
      <form id="login-form">
        <div class="mb-3"><label for="email" class="form-label">Correo</label><input id="email" name="email" class="form-control" type="email" required autocomplete="email"></div>
        <div class="mb-3"><label for="password" class="form-label">Contraseña</label><input id="password" name="password" class="form-control" type="password" required minlength="6" autocomplete="current-password"></div>
        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
      </form>
      <p class="text-center mt-4 mb-0">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
